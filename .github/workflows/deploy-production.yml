name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rollback_version_id:
        description: Worker version ID to roll back to (manual rollback job only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-queerglobal-grandkru-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.9.0

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Capture current Worker version
        run: doppler run -- node scripts/capture-worker-version.mjs .previous-worker-version

      - name: Ensure OpenTofu state bucket
        run: doppler run -- node scripts/ensure-tf-state-bucket.mjs

      - name: OpenTofu init and apply
        id: apply
        run: |
          doppler run -- bash -ec '
            test -n "$CLOUDFLARE_API_TOKEN"
            test -n "$CLOUDFLARE_ACCOUNT_ID"
            test -n "$TF_STATE_BUCKET"
            test -n "$AWS_ACCESS_KEY_ID"
            test -n "$AWS_SECRET_ACCESS_KEY"
            export TF_VAR_cloudflare_account_id="$CLOUDFLARE_ACCOUNT_ID"
            export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
            if [ -n "${AWS_SESSION_TOKEN:-}" ]; then
              export AWS_SESSION_TOKEN
            fi
            {
              echo "bucket = \"$TF_STATE_BUCKET\""
              echo "key = \"${TF_STATE_KEY:-queerglobal-grandkru/terraform.tfstate}\""
              echo "region = \"${TF_STATE_REGION:-auto}\""
              if [ -n "${TF_STATE_ENDPOINT:-}" ]; then
                echo "endpoint = \"$TF_STATE_ENDPOINT\""
                echo "skip_credentials_validation = true"
                echo "skip_metadata_api_check = true"
                echo "skip_region_validation = true"
              fi
            } > /tmp/backend.hcl
            tofu -chdir=infra init -backend-config=/tmp/backend.hcl
            tofu -chdir=infra apply -auto-approve
          '

      - name: Production smoke test
        id: smoke
        run: doppler run -- node scripts/check-production-site.mjs https://queerglobal.grandkru.com

      - name: Roll back Worker on smoke-test failure
        if: failure() && steps.apply.outcome == 'success' && steps.smoke.outcome == 'failure'
        run: |
          PREVIOUS="$(tr -d '\n' < .previous-worker-version 2>/dev/null || true)"
          if [ -z "$PREVIOUS" ] || [ "$PREVIOUS" = "__NO_PREVIOUS_WORKER__" ]; then
            echo "No previous Worker version (first deploy); skip rollback."
          else
            doppler run -- node scripts/worker-rollback.mjs "$PREVIOUS"
          fi

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_version_id != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Roll back Worker
        env:
          ROLLBACK_VERSION_ID: ${{ inputs.rollback_version_id }}
        run: doppler run -- node scripts/worker-rollback.mjs "$ROLLBACK_VERSION_ID"
