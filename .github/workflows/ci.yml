name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          checksums: 8ccbc6f8ee21d2827715f3c6e08a9b3e0209b1e62057c05067ef117e047c1a80

      - name: Install dependencies
        run: npm ci

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infra/

      - name: Validate OpenTofu configuration
        env:
          TF_VAR_bootstrap_state_passphrase: mock-bootstrap-passphrase-for-ci
        run: |
          tofu -chdir=infra init -backend=false
          tofu -chdir=infra validate
          tofu -chdir=infra/bootstrap init -input=false
          tofu -chdir=infra/bootstrap validate

      - name: Run OpenTofu mock tests
        env:
          TF_VAR_bootstrap_state_passphrase: mock-bootstrap-passphrase-for-ci
        run: |
          tofu -chdir=infra test
          tofu -chdir=infra/bootstrap test

      - name: Run tests and bootstrap e2e scripts
        run: npm test
